# Vérifications automatiques à chaque pull request et à chaque mise à jour de main :
# tests, documentation de l'API, migrations, vulnérabilités connues des dépendances.
# Droits minimaux : lecture seule du code, aucun secret utilisé (sûr pour les PR de forks).
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Clé factice, réservée aux tests (jamais une vraie clé ici)
      SECRET_KEY: cle-de-test-ci-pas-un-secret-assez-longue-0123456789
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Installer les dépendances
        run: pip install -r requirements/dev.txt -r requirements/prod.txt pip-audit
      - name: Tests
        run: python -m pytest -q
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Réglages de production (check --deploy)
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: cle-factice-de-verification-ci-assez-longue-pour-le-controle-0123456789
          ALLOWED_HOSTS: nounou.example
          ADMIN_URL: gestion-ci/
          DB_NAME: x
          DB_USER: x
          DB_PASSWORD: x
      - name: Vulnérabilités connues (pip-audit)
        run: pip-audit -r requirements/prod.txt -r requirements/dev.txt

  application:
    name: Application (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Poids de l'application (limite pour la 3G)
        run: npm run size
      - name: Vulnérabilités connues (npm audit)
        run: npm audit --audit-level=high
